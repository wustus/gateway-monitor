{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "gateway-monitor.fullname" . }}
rules:
- apiGroups: [""]
  resources:
    - namespaces
  verbs:
    - get
- apiGroups:
    - gateway.networking.k8s.io
  resources:
    - gateways
    - listenersets
  verbs:
    - get
- apiGroups:
    - gateway.networking.k8s.io
  resources:
    - httproutes
    - tlsroutes
  verbs:
    - list
{{- end }}
