apiVersion: v1
kind: Service
metadata:
  name: {{ include "gateway-monitor.fullname" . }}
  labels:
    {{- include "gateway-monitor.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "gateway-monitor.selectorLabels" . | nindent 4 }}
