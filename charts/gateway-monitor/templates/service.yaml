apiVersion: v1
kind: Service
metadata:
  name: {{ include "gateway-monitor.fullname" . }}
  labels:
    {{- include "gateway-monitor.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: 9100
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "gateway-monitor.selectorLabels" . | nindent 4 }}
