{{- with .Values.serviceMonitor }}
{{- if .enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "gateway-monitor.fullname" $ }}-servicemonitor
spec:
  endpoints:
  - interval: {{ .interval }}
    targetPort: metrics
    path: /metrics
  selector:
    matchLabels:
      {{- include "gateway-monitor.selectorLabels" $ | nindent 6 }}
{{- end }}
{{- end }}
