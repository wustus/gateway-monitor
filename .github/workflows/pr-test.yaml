name: Test PR

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go Tests
    run-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Run tests
        run: go test -v ./...

      - name: Run vet
        run: go vet ./...
